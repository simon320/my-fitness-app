
<header class="header">
    <div class="header__title">
        <span>Hola, {{ nameUser() | titlecase }}</span>
        <p>¡Listo para entrenar!</p>
    </div>

    <app-exercise-cart />


    <div class="avatar-container">
        @if(userImg()) {
            <img class="avatar-img" [src]="userImg()" alt="user-img" />
        }
        @else {
            <icon-avatar-default />
        }   
    </div>
</header>
