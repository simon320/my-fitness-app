
<header class="header">
    <div class="header__title">
        <span>Hola, {{ nameUser() | titlecase }}</span>
        <p>¡Listo para entrenar!</p>
    </div>

    <div class="profile">
        @if(userImg()) {
            <img src="assets/logo.png" alt="user-img" />
        }
        @else {
            <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-user-icon lucide-circle-user">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="10" r="3"/>
                <path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"/>
            </svg> 
        }   
    </div>
</header>
