<div class="routine-section">
    <div class="routine-header">
        <h2>Rutinas guardadas</h2>
        <span>ver todas</span>
    </div>

    <div class="routine-scroll">
        @for(routine of routines(); track $index) {
        <div class="routine-card">
            <button class="play-button" (click)="startRoutine(routine)">▶</button>
            @if(routine.image) {
                <img [src]="routine.image" alt="routine preview" />
            }
            <div class="info">
                <div class="card-header">
                    <h3>{{ routine.name }}</h3>
                    <span class="exercises-length">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1daf41" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 1 0-2.829 2.829z" />
                            <path d="m2.5 21.5 1.4-1.4" />
                            <path d="m20.1 3.9 1.4-1.4" />
                            <path d="M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z" />
                            <path d="m9.6 14.4 4.8-4.8" />
                        </svg>
                        {{ routine.exercises.length }}
                    </span>
                </div>
                <div class="muscle-group">
                    @for(muscle of routine.muscleGroup; track $index) {
                    <span>{{ muscle }}</span>
                    }
                </div>
            </div>
        </div>
        }
    </div>
</div>
