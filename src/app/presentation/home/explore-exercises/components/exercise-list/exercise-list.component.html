<div class="exercise-grid">

  @for (exercise of exercises(); track $index) {
    <div
      class="exercise-card"
      [class.selected]="isSelected(exercise)"
      (click)="toggleSelection(exercise)"
      >

      <div class="checkbox-wrapper">
        <label class="custom-checkbox">
          <input type="checkbox" [checked]="isSelected(exercise)" />
          <span class="checkmark"></span>
        </label>
      </div>

      <div class="exercise-content">
        <h3 class="exercise-title">{{ exercise.name }}</h3>
        <p><strong>Grupo principal:</strong> {{ exercise.target }}</p>
      </div>

      <img [src]="exercise.gifUrl" alt="{{ exercise.name }}" class="exercise-image" />


    </div>
  }

</div>
