<!-- Trigger -->
<button #dropdownTrigger (click)="toggleDropdown()">Abrir Dropdown</button>

<!-- Dropdown menu como template para el Overlay -->
<ng-template #dropdownMenu>
  <ul class="dropdown-menu animated">
    <li>Opción A</li>
    <li>Opción B</li>
    <li>Opción C</li>
  </ul>
</ng-template>
