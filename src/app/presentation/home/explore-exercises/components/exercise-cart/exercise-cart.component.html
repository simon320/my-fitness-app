<!-- Exercises Cart -->
<div class="exercises-length">
    <div #addExerciseEffect class="add-effect"></div>
    @if(routine() && routine()!.length > 0) {
        <div (click)="toggleOptions('open')" class="cart-container">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1daf41"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path
                    d="M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 1 0-2.829 2.829z" />
                <path d="m2.5 21.5 1.4-1.4" />
                <path d="m20.1 3.9 1.4-1.4" />
                <path
                    d="M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z" />
                <path d="m9.6 14.4 4.8-4.8" />
            </svg>
            <span>{{ routine()?.length }}</span>
        </div>
    }
</div>

<!-- Modal -->
@if(openModal()) {
    <div class="modal-backdrop" (click)="toggleOptions('close')"></div>

    <div class="modal-container">
        <app-circle-button [propertiesOfShadows]="'1px 1px 4px #000'" [bgColor]="'#2b2b2b'" [colorIcon]="'#ccc'" [size]="35" [icon]="'x'" (click)="toggleOptions('close')"/>
        
        @if(!calendarModal()) {
            <h2 class="modal-title">Renombrar rutina</h2>
            <input type="text" [(ngModel)]="routineName" class="modal-input" placeholder="Nombre de la rutina (opcional)" />
            
            <div class="exercises-list-container">
                @for(exercise of routine(); track $index) {
                    <div class="exercise-card">
                        <div class="card-left">
                            <img [src]="exercise.gifUrl" alt="{{ exercise.name }}" />
                            <div class="info-card">
                                <h3>{{ exercise.name | truncate:20 }}</h3>
                            </div>
                        </div>
                        <div class="btn-delete" (click)="removeExercise(exercise)">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 6h18"/>
                                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                                <line x1="10" x2="10" y1="11" y2="17"/>
                                <line x1="14" x2="14" y1="11" y2="17"/>
                            </svg>
                        </div>
                    </div>
                }
            </div>
            
            <div class="modal-buttons">
                <button class="btn primary" (click)="createWorkoutFlow()">Entrenar</button>
                <button class="btn secondary" (click)="openModalCalendarFlow()">Programar en fecha</button>
                <button class="btn tertiary" (click)="createRoutine()">Solo guardar</button>
            </div>
        }

        @else {
            <div class="calendar-modal-container">
                <input type="date" [(ngModel)]="routineDate">
                <div class="modal-buttons">
                    <button class="btn primary" (click)="createCalendarFlow()">Guardar</button>
                </div>
            </div>
        }

    </div>
}
