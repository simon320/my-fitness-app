
<div class="search-wrapper" (click)="toggleDropdown(true)">
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search-icon lucide-search">
    <path d="m21 21-4.34-4.34"/>
    <circle cx="11" cy="11" r="8"/>
  </svg>
  <input 
    type="text" 
    placeholder="Explora ejercicios por grupo muscular" 
    [(ngModel)]="searchTerm" 
    class="search-input" 
    (focus)="toggleDropdown(true)"
    (blur)="toggleDropdown(false)" />
</div>

 @if(isOpen()) {
   <div class="muscle-dropdown">
    @for(group of bodyParts(); track $index) {
      <div class="muscle-option" (click)="selectMuscle(group)">
        {{ group }}
      </div>
    }
   </div>
 }
