<button
  class="circle-btn"
  [ngStyle]="{
    backgroundColor: bgColor(),
    width: size() + 'px',
    height: size() + 'px',
    fontSize: size() * 0.4 + 'px',
    color: colorIcon(),
    border: isDisabled() ? 'none' : broad() + 'px solid ' + colorBorder(),
    boxShadow: isDisabled() ? 'none' : propertiesOfShadows(),
  }"
  (click)="onClick()"
  [disabled]="isDisabled()"
>
  <div class="align-icon">
    {{ icon() }}
  </div>
</button>
