<button
  class="arrow-btn"
  [ngStyle]="{
    color: color(),
    width: size() + 'px',
    height: size() + 'px',
    fontSize: size() * 0.4 + 'px'
  }"
  (click)="onClick()"
>
  <div class="align-icon">
    @if(iconUp()) {
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevrons-up-icon lucide-chevrons-up">
        <path d="m17 11-5-5-5 5"/>
        <path d="m17 18-5-5-5 5"/>
      </svg>
    }
    @else {
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevrons-down-icon lucide-chevrons-down">
        <path d="m7 6 5 5 5-5"/>
        <path d="m7 13 5 5 5-5"/>
      </svg>
    }
  </div>
</button>
